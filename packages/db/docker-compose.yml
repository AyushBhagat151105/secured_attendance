name: secured_attendance

services:
  postgres:
    image: postgres
    container_name: secured_attendance-postgres
    environment:
      POSTGRES_DB: secured_attendance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - secured_attendance_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: secured_attendance_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - secured_attendance_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  secured_attendance_postgres_data:
  secured_attendance_redis_data:
