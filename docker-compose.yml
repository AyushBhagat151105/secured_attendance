# Docker Compose for secured_attendance
# Full-stack container orchestration

name: secured_attendance

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        - VITE_SERVER_URL=http://localhost:3001
    container_name: secured_attendance-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    depends_on:
      - server
    networks:
      - secured_attendance-network

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: secured_attendance-server
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Kolkata
      - DATABASE_URL=postgresql://postgres:password@db:5432/secured_attendance
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-default_super_secure_production_secret_key_32_chars}
      - BETTER_AUTH_URL=http://localhost:3001
      - CORS_ORIGIN=http://localhost:3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped
    depends_on:
      - db
      - redis
    networks:
      - secured_attendance-network

  db:
    image: postgres:16-alpine
    container_name: secured_attendance-postgres
    environment:
      POSTGRES_DB: secured_attendance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - secured_attendance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - secured_attendance-network

  redis:
    image: redis:7-alpine
    container_name: secured_attendance-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - secured_attendance-network

networks:
  secured_attendance-network:
    driver: bridge

volumes:
  secured_attendance_postgres_data:
