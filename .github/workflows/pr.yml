name: CI - Pull Request & Integration Tests

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Test & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/secured_attendance_ci"
      BETTER_AUTH_SECRET: "ci-dummy-institutional-secret-key-32-chars-long"
      BETTER_AUTH_URL: "http://localhost:3000"
      CORS_ORIGIN: "http://localhost:5173"
      ALLOW_DEV_SEED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for toolchain compatibility)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Verify TypeScript compilation across all packages
        run: bun run check-types

      - name: Run Unit & E2E Isolated Test Suite
        run: bun test

      - name: Verify Monorepo Production Builds
        run: bun run build
