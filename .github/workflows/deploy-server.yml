name: Deploy Server to Hostinger VPS

on:
  push:
    branches:
      - main
      - master
    paths:
      - "apps/server/**"
      - "packages/**"
      - "docker-compose.prod.yml"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_SERVER: ghcr.io/ayushbhagat151105/secured_attendance-server

jobs:
  build-server:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Server App
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME_SERVER }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [build-server]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /root/secured_attendance
            # Ensure the remote URL is set to SSH to use Deploy Keys if configured
            git remote set-url origin git@github.com:${{ github.repository }}.git 2>/dev/null || true
            # Pull latest git commit
            GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" git pull origin master || GIT_SSH_COMMAND="ssh -o StrictHostKeyChecking=no" git pull origin main || true

            # Authenticate Docker on VPS to pull GHCR packages
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Ensure upload directories exist on host
            mkdir -p /root/secured_attendance/uploads/updates /root/secured_attendance/uploads/downloads

            # Pull pre-built image and restart containers
            docker compose -f docker-compose.prod.yml pull server
            docker compose -f docker-compose.prod.yml up -d

            # Run Prisma db push against NeonDB inside server container
            docker compose -f docker-compose.prod.yml exec -T server bun run --cwd /app/packages/db db:push || true
            docker compose -f docker-compose.prod.yml exec -T server bun run --cwd /app/packages/db db:generate || true

            # Clean up credentials
            docker logout ghcr.io
            echo "Successfully deployed Secured Attendance backend server!"
